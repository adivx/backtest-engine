[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest-engine"
version = "0.1.0"
description = "Lightweight event-driven backtesting engine — strategy framework, trade simulation, and risk metrics in pure stdlib Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["rich>=13"]

[project.scripts]
backtest = "backtest.cli:main"

[tool.setuptools]
packages = ["backtest"]
